<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="optTitle">Interpretab — Options</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body { max-width: 44rem; margin: 0 auto; height: auto; padding: 1.5rem; font-size: 14px; }
      /* Two groups, and the sections inside them. The group label is smaller
         than the sections it covers on purpose: it is a divider, not a heading
         anyone came here to read, and a label that outsized "Gemini API key"
         would push the thing being labelled down the page. No uppercasing or
         letter-spacing either — this text is also Japanese, Hindi and Arabic. */
      h2 {
        font-size: 0.8rem; font-weight: 600; color: var(--muted);
        margin: 2rem 0 0.4rem; padding-top: 1rem; border-top: 1px solid var(--border);
      }
      h3 { font-size: 1rem; font-weight: 500; margin: 1.2rem 0 0.2rem; }
      input[type="text"], input[type="password"] { font: inherit; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 0.3rem; width: 100%; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      th, td { text-align: start; border-bottom: 1px solid var(--border); padding: 0.25rem 0.4rem; }
      th { color: var(--muted); font-weight: 500; }
      #glossaryList { max-height: 16rem; overflow-y: auto; border: 1px solid var(--border); border-radius: 0.3rem; }
      /* Device labels are sentences — "MacBook Pro Speakers (Built-in)" — and the
         side panel's 11rem cap would cut every one of them off. */
      #micInput, #micOutput { max-width: 26rem; }
      .ok { color: #188038; }
      /* A stand-in for the page behind the subtitles, so the size is judged
         against a dark video frame rather than against this white page. */
      #captionPreview {
        margin-top: 0.5rem; padding: 0.6rem; border-radius: 0.3rem;
        background: #3c4043; text-align: center; overflow: hidden;
      }
      #captionPreview span {
        display: inline-block; color: #fff; line-height: 1.4;
        background: rgba(0, 0, 0, 0.72); padding: 0.16em 0.5em;
        border-radius: 0.25em; text-align: center;
        font-family: "Google Sans", "Noto Sans", "Noto Sans JP", "Noto Sans SC",
          "Noto Sans KR", "Noto Sans Devanagari", "Noto Sans Arabic", sans-serif;
      }
    </style>
  </head>
  <!-- `lang` is set by `localize()` rather than declared: see sidepanel.html. -->
  <body>
    <h1 style="font-size: 1.15rem; font-weight: 500; margin: 0" data-i18n="optHeading"></h1>

    <!-- The three answers a first run needs, in the order the panel asks for
         them. Everything below the second group heading has a default that
         works, which is the whole of the difference: a reader who has pasted a
         key can stop at the rule and lose nothing. -->
    <h2 data-i18n="optSetupHeading"></h2>
    <p class="note" data-i18n="optSetupNote"></p>

    <h3 data-i18n="optKeyHeading"></h3>
    <p
      class="note"
      data-i18n="optKeyNote"
      data-link1="https://aistudio.google.com/apikey"
      data-link2="https://aistudio.google.com/apikey"
    ></p>
    <div class="row">
      <!-- No format in the placeholder. It said "AIza…" while Google was
           issuing keys that started that way, and then Google started issuing
           "AQ.…" ones — at which point the hint was telling people holding the
           newer key to look for something they did not have. -->
      <input
        type="password"
        id="apiKey"
        spellcheck="false"
        autocomplete="off"
        data-i18n-placeholder="optKeyPlaceholder"
      />
      <button id="toggleKey" class="ghost" data-i18n="optShow"></button>
    </div>
    <p class="note" id="apiKeyStatus"></p>

    <h3 data-i18n="optPlanHeading"></h3>
    <p class="note" data-i18n="optPlanNote" data-link1="https://aistudio.google.com/apikey"></p>
    <div class="row">
      <select id="apiTier" class="mode">
        <option value="free" data-i18n="optPlanFree"></option>
        <option value="paid" data-i18n="optPlanPaid"></option>
      </select>
    </div>

    <!-- Where the panel's microphone step lands. A side panel cannot raise
         Chrome's permission prompt, so the grant has to happen on this page. It
         is up here rather than in the middle of the page because it is the one
         thing in this group a reader can be sent to rather than arrive at. -->
    <h3 id="micHeading" data-i18n="optMicHeading"></h3>
    <p class="note" data-i18n="optMicNote"></p>
    <div class="row">
      <button id="grantMic" class="ghost" data-i18n="optMicGrant"></button>
      <span class="note" id="micStatus"></span>
    </div>

    <h2 data-i18n="optRestHeading"></h2>
    <p class="note" data-i18n="optRestNote"></p>

    <h3 data-i18n="optVoiceHeading"></h3>
    <p class="note" data-i18n="optVoiceNote"></p>
    <div class="row"><select id="voice" class="lang"></select></div>

    <h3 data-i18n="optSizeHeading"></h3>
    <p class="note" data-i18n="optSizeNote"></p>
    <div class="row">
      <input type="range" id="captionSize" min="16" max="64" step="2" />
      <output id="captionSizeOut"></output>
    </div>
    <div id="captionPreview"><span data-i18n="optSizePreview"></span></div>

    <h3 data-i18n="optInputHeading"></h3>
    <p class="note" data-i18n="optInputNote"></p>
    <div class="row">
      <select id="micInput" class="lang"></select>
      <span class="note" id="micInputStatus"></span>
    </div>

    <h3 data-i18n="optOutputHeading"></h3>
    <p class="note" data-i18n="optOutputNote"></p>
    <div class="row">
      <select id="micOutput" class="lang"></select>
      <span class="note" id="micOutputStatus"></span>
    </div>

    <h3 data-i18n="optGlossaryHeading"></h3>
    <p class="note" data-i18n="optGlossaryNote"></p>
    <div class="row">
      <input type="file" id="glossaryFile" accept=".csv" />
      <button id="uploadGlossary" class="ghost" data-i18n="optGlossaryReplace"></button>
      <button id="resetGlossary" class="ghost" data-i18n="optGlossaryReset"></button>
      <span id="glossaryStatus" class="note"></span>
    </div>
    <div id="glossaryList"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
