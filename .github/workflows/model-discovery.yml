# Find the successor to a Live model that has gone away, and commit it.
#
# Runs once a day, and out of turn whenever `model-health.yml` finds a model
# that the API says is not there any more.
#
# It commits straight to main, which means it edits a file every installed copy
# of the extension reads within hours, with no human in between. Three things
# stand between a language model's guess and that file:
#
#   1. A name only reaches the config after a real Live session has been opened
#      with it and answered `setupComplete`. An invented name never verifies.
#   2. `mergeConfig` may add, and it reorders in one case only: a newcomer goes
#      behind the name already serving users unless that name has a published
#      shutdown date within a week, and it cannot empty a list.
#   3. `blockBelowVersion` -- the field that can stop every installation -- is
#      copied through untouched, and the script aborts if it ever isn't.
#
# See `tests/model-tools.test.js`, which is about exactly those rules.
#
# It also watches what goes wrong without anything failing. A price the agent
# could not read leaves the file identical to a price that did not change; the
# table compiled into the build drifts from the published one with nothing
# shipping the correction; and the model names compiled into the build fall
# behind the ones the config starts sessions on. None of the three shows up as a
# failed run, so each gets an issue -- see the step at the end.
name: Model discovery

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: model-discovery
  cancel-in-progress: false

permissions:
  contents: write
  # Workload Identity Federation. No service-account key lives in this
  # repository: the runner proves who it is with a short-lived OIDC token and
  # Google hands back an access token good for the hour.
  id-token: write
  # The two pricing issues at the end. `model-health.yml` calls this workflow and
  # a called workflow gets no more than its caller grants, so this is declared
  # there as well.
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - id: find
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: node tools/find-models.mjs

      # The unit tests, against the file the agent just wrote. `mergeConfig` is
      # covered by them either way, but "the committed config round-trips
      # through the extension's own parser" is only true of a real file.
      - if: steps.find.outputs.changed == 'true'
        run: npm test

      - if: steps.find.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/config.json
          git commit -F "${{ runner.temp }}/commit-message.txt"
          git push

      # "No change" is the healthy answer on an ordinary morning. During an
      # outage it is the opposite: the agent went looking for the successor to a
      # model that is gone and came back with nothing, and the next thing that
      # tries is this same agent, once a human closes the issue. Nothing else
      # reports that, so it is reported where the outage is already being read.
      # The loop is empty when no outage is open, which is most days.
      - if: steps.find.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label model-outage --state open --json number --jq '.[].number'); do
            gh issue comment "$number" --body "The discovery agent ran and found nothing to commit — docs/config.json is unchanged.

          Either the successor is not documented yet, or every candidate failed to open a session.
          The run log says which. Closing this issue arms the agent for one more attempt; a name
          found by hand goes into docs/config.json the same way.

          Run: ${RUN_URL}"
          done

      # After the commit, so it compares the file that was just published, and
      # `continue-on-error` because a difference is the thing this step is for.
      - id: rates
        continue-on-error: true
        run: node tools/check-rates.mjs

      # Three ways the file goes wrong quietly, each behind one open issue that
      # is also its own lock: while it is open nothing new is filed, and it
      # closes itself when the condition clears. Same shape as the
      # `model-outage` issue in `model-health.yml`, and deliberately different
      # labels, so none of these ever stops the discovery agent from running.
      #
      # Everything the bodies say goes through the environment. Two of these
      # strings are model names an agent chose, and a shell that interpolates
      # those onto a command line is one backtick away from a substitution.
      - env:
          GH_TOKEN: ${{ github.token }}
          UNPRICED: ${{ steps.find.outputs.unpriced }}
          READ_AT: ${{ steps.find.outputs.ratesReadAt }}
          STALE: ${{ steps.find.outputs.pricesStale }}
          DRIFT: ${{ steps.rates.outputs.drift }}
          SUMMARY: ${{ steps.rates.outputs.summary }}
          MODEL_DRIFT: ${{ steps.find.outputs.modelDrift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          raise() {
            gh label create "$1" --color fbca04 --description "$2" 2>/dev/null || true
            if [ "$(gh issue list --label "$1" --state open --json number --jq 'length')" -gt 0 ]; then
              echo "$1: already open"
              return
            fi
            gh issue create --label "$1" --title "$3" --body "$4"
          }
          settle() {
            for number in $(gh issue list --label "$1" --state open --json number --jq '.[].number'); do
              gh issue comment "$number" --body "$2"
              gh issue close "$number"
            done
          }

          if [ "$STALE" = "true" ]; then
            raise price-stale "The prices in docs/config.json have not been confirmed" \
              "Pricing not confirmed since ${READ_AT:-never}" \
              "The discovery run came back with no price for: ${UNPRICED}

          docs/config.json still carries the old numbers, which is the safe thing to do and
          also means the file looks exactly as it would if Google had changed nothing. The
          panel is printing those numbers at every user who has fetched the file.

          Check https://ai.google.dev/pricing by hand. If the prices are right, the prompt in
          tools/find-models.mjs stopped reading the page and needs looking at; if they are
          wrong, correct docs/config.json and lib/usage.js together.

          Run: ${RUN_URL}

          This issue closes itself on the next run that prices every model a session starts on."
          else
            settle price-stale "Prices confirmed again as of ${READ_AT}, by run ${RUN_URL}"
          fi

          if [ "$DRIFT" = "true" ]; then
            raise price-drift "The prices compiled into the build are behind docs/config.json" \
              "lib/usage.js is behind docs/config.json" \
              "${SUMMARY}

          docs/config.json is corrected within a day and reaches an installed copy within six
          hours. lib/usage.js is corrected by a release, and it is what prices a fresh install
          before its first fetch, a user who turned Model updates off in Options, and anyone
          offline.

          Copy the numbers into RATES in lib/usage.js, update the date in the comment above
          them, and ship it. Nothing automated may edit that file: the argument for letting
          this workflow commit unattended is that it writes data and never code.

          Run: ${RUN_URL}"
          else
            settle price-drift "The build and the config agree on prices again, as of run ${RUN_URL}"
          fi

          if [ -n "$MODEL_DRIFT" ]; then
            raise model-drift "The model names compiled into the build are behind docs/config.json" \
              "lib/languages.js is behind docs/config.json" \
              "The config now starts on a different model than the build does — ${MODEL_DRIFT}

          Sessions are fine: every install reads the file within six hours and starts on the
          first name in it. Two groups are not. A fresh install has no config yet and runs the
          bundled name until its first fetch, and so does anyone who turned Model updates off
          in Options.

          Move MODEL and SIMUL_MODEL in lib/languages.js to the names above, check
          docs/config.json still lists the old ones as fallbacks, and ship it. Nothing
          automated may edit that file: the argument for letting this workflow commit
          unattended is that it writes data and never code.

          Run: ${RUN_URL}"
          else
            settle model-drift "The build and the config start on the same models again, as of run ${RUN_URL}"
          fi
