# GitHub Pages settings. Pages builds from this directory, so the site is the
# user guide — `index.md` and its nine translations — `PRIVACY.md`, and the
# images in `assets/`. Nothing above here is published, which is the whole of
# why those images are in `assets/` and not in the `store/` and `icons/`
# directories the pages used to point at.
#
# One file here is not a page: `config.json` has no front matter, so Jekyll
# copies it to the site root verbatim, and that is the copy every installed
# extension reads. See "The two facts that expire" in the README before editing
# it — a mistake in that file reaches every user within six hours.
#
# Until this file existed, Pages ran with its own defaults, which meant the theme
# below applied anyway. It is named here so that `_layouts/default.html` is
# understood as an override of a known layout rather than the only one.
title: Interpretab
theme: jekyll-theme-primer

# There is deliberately no site-wide `description`. jekyll-seo-tag appends one to
# the `<title>` of any page whose title is the site's — which is all ten of them —
# and a site-wide description can only be in one language. Each page carries its
# own in its front matter, which is where the `<meta name="description">` a search
# result shows comes from, in the language of the page it describes.

# The fallback for a page that does not declare one. Every guide page does; this
# covers `PRIVACY.md`, which is English and has no front matter at all.
lang: en
