# The install steps, in the ten languages the guide is written in.
#
# They used to be a numbered list repeated inside every `index.md`. They are out
# here because the install section is now a slideshow — a picture, a tab strip
# and a pane per step — and ten copies of that markup, nine of them in a script
# nobody editing the HTML can read, is the arrangement in which a fix lands on
# one page and not the other nine. `_includes/install-steps.html` is the markup,
# once; this is the words, ten times.
#
# Getting the key is four of the steps and not one. It is the only part of the
# install that leaves Chrome, it is where somebody who has never seen a console
# gives up, and "get a free key at aistudio.google.com/apikey" was one clause
# covering a sign-in, a button, a project picker and a copy.
#
# The count is not fixed here — `_includes/head-custom.html` styles as many
# steps as English has — but every language has to have the same number of them,
# and `tests/assets.test.js` is where that is enforced.
#
# `body` is HTML rather than markdown: an include is not passed through the
# markdown converter, so the links and the bold have to arrive already made.
# Links are written plainly, with no `target`: the include adds one to every
# link it renders, so a translation cannot be the one that sends a reader out of
# the slideshow and loses their place in it.
# `tab` is the label on the step's button and has to stay short — eight of them
# wrap to a second row in every language.
#
# The keys are the `code` values in `languages.yml`, and a page whose language
# is missing here falls back to English rather than rendering an empty slide.

en:
  steps:
    - tab: Add to Chrome
      body: >-
        Open <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        on the Chrome Web Store</a> and press <b>Add to Chrome</b>.
    - tab: Open Google AI Studio
      body: >-
        Interpretab translates with Google's Gemini, and Gemini needs an API key of your own.
        Getting one is free: open <a href="https://aistudio.google.com/apikey">Google AI Studio</a> and sign in
        with a Google account.
    - tab: Create a key
      body: >-
        The page lists the keys you have, which on a new account is none. Press
        <b>Create API key</b>.
    - tab: Pick a project
      body: >-
        A key belongs to a Google Cloud project, and AI Studio asks which one. Pick <b>Default
        project</b>, the one already in the list, and press <b>Create key</b>. Any project will do —
        the key is the same either way.
    - tab: Copy the key
      body: >-
        The key appears as soon as the project is ready. Press <b>Copy</b>. It stays on the API keys
        page, so you can come back for it later.
    - tab: Paste it in
      body: >-
        Interpretab's <b>Options</b> page opens by itself the first time, and the <b>Options</b>
        button at the bottom of the side panel opens it again. Paste the key into <b>Gemini API
        key</b>. It is kept in this browser and goes to nobody but Google.
    - tab: Click the icon
      body: >-
        Open the page you want translated — a video with talking in it on
        <a href="https://www.youtube.com/">youtube.com</a> is the easiest first test — and <b>click
        the Interpretab toolbar icon on that tab</b>. That click is how you give permission to listen
        to the tab; skip it and you get an error.
    - tab: Press Start
      body: >-
        Pick your language in the side panel and press <b>Start</b>. Tab audio is on from the
        beginning, so there is nothing else to switch on.

# Chinese, Japanese and Korean below are one line per `body` on purpose. A
# folded scalar joins its lines with a space, and a space between two kanji is a
# space a reader sees.
ja:
  steps:
    - tab: Chrome に追加
      body: <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome ウェブストアの Interpretab</a> を開き、<b>Chrome に追加</b>を押す。
    - tab: Google AI Studio を開く
      body: 翻訳するのは Google の Gemini で、Gemini には自分専用の API キーが必要です。取得は無料です。<a href="https://aistudio.google.com/apikey">Google AI Studio</a> を開き、Google アカウントでログインします。
    - tab: キーを作成
      body: このページには持っているキーが並びます。新しいアカウントならまだ一つもありません。<b>Create API key</b> を押します。
    - tab: プロジェクトを選ぶ
      body: キーは Google Cloud のプロジェクトに属するので、どのプロジェクトかを聞かれます。一覧にある <b>Default project</b> を選び、<b>Create key</b> を押します。どのプロジェクトでもかまいません。キーの働きは同じです。
    - tab: キーをコピー
      body: プロジェクトの準備ができるとキーが表示されます。<b>Copy</b> を押します。キーは API keys のページに残るので、あとから取り直せます。
    - tab: キーを貼り付け
      body: 拡張機能の<b>オプション</b>ページは初回に自動で開きます。サイドパネル下部の <b>Options</b> ボタンからも開けます。<b>Gemini API key</b> にキーを貼り付けてください。キーはこのブラウザに保存され、Google 以外には送られません。
    - tab: アイコンをクリック
      body: 翻訳したいページを開きます。最初の確認には <a href="https://www.youtube.com/">youtube.com</a> の話し声が入った動画が手軽です。そのうえで<b>そのタブで Interpretab のツールバーアイコンをクリックします</b>。このクリックが、このタブの音声を聞いてよいという許可になります。押さずに始めるとエラーになります。
    - tab: Start を押す
      body: サイドパネルで言語を選び、<b>Start</b> を押します。タブ音声は最初からオンなので、ほかに入れる設定はありません。

zh:
  steps:
    - tab: 添加至 Chrome
      body: 打开 <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome 应用商店中的 Interpretab</a>，点击<b>添加至 Chrome</b>。
    - tab: 打开 Google AI Studio
      body: 翻译由 Google 的 Gemini 完成，而 Gemini 需要一个属于你自己的 API 密钥。申请是免费的：打开 <a href="https://aistudio.google.com/apikey">Google AI Studio</a>，用 Google 账号登录。
    - tab: 创建密钥
      body: 这个页面会列出你已有的密钥，新账号还是空的。点击 <b>Create API key</b>。
    - tab: 选择项目
      body: 密钥属于某个 Google Cloud 项目，AI Studio 会问用哪一个。选列表里已经有的 <b>Default project</b>，然后点 <b>Create key</b>。用哪个项目都行，密钥是一样的。
    - tab: 复制密钥
      body: 项目准备好之后密钥就会出现。点 <b>Copy</b>。密钥会留在 API keys 页面上，之后还能回去再拿。
    - tab: 粘贴密钥
      body: 扩展的<b>选项</b>页面第一次会自己打开，侧边栏底部的 <b>Options</b> 按钮也能再把它打开。把密钥粘贴到 <b>Gemini API key</b> 里。它保存在这个浏览器中，除了 Google 不会发给任何人。
    - tab: 点击图标
      body: 打开要翻译的页面。第一次试的话，<a href="https://www.youtube.com/">youtube.com</a> 上一段有人说话的视频最方便。然后<b>在那个标签页上点击工具栏中的 Interpretab 图标</b>。这次点击就是你授权它收听该标签页的方式——跳过它就会报错。
    - tab: 按 Start
      body: 在侧边栏选择语言，按 <b>Start</b>。标签页声音一开始就是开着的，不用再打开别的开关。

es:
  steps:
    - tab: Añadir a Chrome
      body: >-
        Abre <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        en Chrome Web Store</a> y pulsa <b>Añadir a Chrome</b>.
    - tab: Abre Google AI Studio
      body: >-
        Quien traduce es Gemini, de Google, y Gemini necesita una clave de API tuya. Conseguirla es
        gratis: abre <a href="https://aistudio.google.com/apikey">Google AI Studio</a> e inicia sesión con una
        cuenta de Google.
    - tab: Crea la clave
      body: >-
        La página lista las claves que tienes, que en una cuenta nueva son ninguna. Pulsa
        <b>Create API key</b>.
    - tab: Elige proyecto
      body: >-
        Una clave pertenece a un proyecto de Google Cloud, y AI Studio pregunta a cuál. Elige
        <b>Default project</b>, el que ya está en la lista, y pulsa <b>Create key</b>. Vale
        cualquier proyecto: la clave es la misma.
    - tab: Copia la clave
      body: >-
        La clave aparece en cuanto el proyecto está listo. Pulsa <b>Copy</b>. Se queda en la página
        de API keys, así que puedes volver a por ella.
    - tab: Pégala
      body: >-
        La página de <b>Opciones</b> de la extensión se abre sola la primera vez, y el botón
        <b>Options</b> del panel lateral la vuelve a abrir. Pega la clave en <b>Gemini API key</b>. Se guarda en
        este navegador y no se envía a nadie más que a Google.
    - tab: Pulsa el icono
      body: >-
        Abre la página que quieras traducir — un vídeo con voz en
        <a href="https://www.youtube.com/">youtube.com</a> es la prueba más fácil para empezar — y
        <b>pulsa el icono de Interpretab en la barra de herramientas estando en esa pestaña</b>. Ese
        clic es como das permiso para escuchar la pestaña; si te lo saltas, obtendrás un error.
    - tab: Pulsa Start
      body: >-
        Elige tu idioma en el panel lateral y pulsa <b>Start</b>. El audio de la pestaña ya viene
        activado, así que no hay nada más que encender.

fr:
  steps:
    - tab: Ajouter à Chrome
      body: >-
        Ouvrez <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        sur le Chrome Web Store</a> et cliquez sur <b>Ajouter à Google Chrome</b>.
    - tab: Ouvrez Google AI Studio
      body: >-
        C'est Gemini, de Google, qui traduit, et Gemini a besoin d'une clé d'API à vous. L'obtenir est
        gratuit : ouvrez <a href="https://aistudio.google.com/apikey">Google AI Studio</a> et connectez-vous
        avec un compte Google.
    - tab: Créez la clé
      body: >-
        La page liste les clés que vous avez, c'est-à-dire aucune sur un compte neuf. Cliquez sur
        <b>Create API key</b>.
    - tab: Choisissez le projet
      body: >-
        Une clé appartient à un projet Google Cloud, et AI Studio demande lequel. Choisissez
        <b>Default project</b>, celui qui est déjà dans la liste, puis cliquez sur <b>Create
        key</b>. N'importe quel projet convient : la clé est la même.
    - tab: Copiez la clé
      body: >-
        La clé apparaît dès que le projet est prêt. Cliquez sur <b>Copy</b>. Elle reste sur la page
        API keys, vous pouvez donc y revenir plus tard.
    - tab: Collez-la
      body: >-
        La page <b>Options</b> de l'extension s'ouvre d'elle-même la première fois, et le bouton
        <b>Options</b> du panneau latéral la rouvre. Collez la clé dans <b>Gemini API key</b>. Elle
        reste dans ce navigateur et n'est envoyée à personne d'autre que Google.
    - tab: Cliquez sur l'icône
      body: >-
        Ouvrez la page à traduire — une vidéo où quelqu'un parle sur
        <a href="https://www.youtube.com/">youtube.com</a> est le test le plus simple pour commencer
        — et <b>cliquez sur l'icône Interpretab de la barre d'outils depuis cet onglet</b>. Ce clic
        est la façon dont vous donnez la permission d'écouter l'onglet : sans lui, vous obtenez une
        erreur.
    - tab: Appuyez sur Start
      body: >-
        Choisissez votre langue dans le panneau latéral et appuyez sur <b>Start</b>. L'audio de
        l'onglet est activé dès le départ, il n'y a rien d'autre à allumer.

de:
  steps:
    - tab: Hinzufügen
      body: >-
        <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        im Chrome Web Store</a> öffnen und auf <b>Hinzufügen</b> klicken.
    - tab: Google AI Studio öffnen
      body: >-
        Übersetzt wird von Gemini, dem Modell von Google, und Gemini braucht einen eigenen
        API-Schlüssel. Der ist kostenlos: <a href="https://aistudio.google.com/apikey">Google AI Studio</a>
        öffnen und mit einem Google-Konto anmelden.
    - tab: Schlüssel erstellen
      body: >-
        Die Seite listet Ihre Schlüssel auf — bei einem neuen Konto also keinen. Auf <b>Create API
        key</b> klicken.
    - tab: Projekt wählen
      body: >-
        Ein Schlüssel gehört zu einem Google-Cloud-Projekt, und AI Studio fragt, zu welchem.
        <b>Default project</b> wählen, das schon in der Liste steht, und auf <b>Create key</b>
        klicken. Jedes Projekt geht; der Schlüssel ist derselbe.
    - tab: Schlüssel kopieren
      body: >-
        Sobald das Projekt bereit ist, erscheint der Schlüssel. Auf <b>Copy</b> klicken. Er bleibt
        auf der Seite API keys, Sie können ihn also später wieder holen.
    - tab: Schlüssel einfügen
      body: >-
        Die Seite <b>Optionen</b> der Erweiterung öffnet sich beim ersten Mal von selbst, und die
        Schaltfläche <b>Options</b> im Seitenbereich öffnet sie wieder. Den Schlüssel in <b>Gemini API key</b>
        einfügen. Er bleibt in diesem Browser und geht an niemanden außer Google.
    - tab: Symbol anklicken
      body: >-
        Die zu übersetzende Seite öffnen — ein Video mit Sprache auf
        <a href="https://www.youtube.com/">youtube.com</a> ist der einfachste erste Test — und <b>auf
        diesem Tab das Interpretab-Symbol in der Symbolleiste anklicken</b>. Mit diesem Klick geben
        Sie die Erlaubnis, den Tab mitzuhören — ohne ihn bekommen Sie eine Fehlermeldung.
    - tab: Start drücken
      body: >-
        Im Seitenbereich Ihre Sprache wählen und <b>Start</b> drücken. Der Ton des Tabs ist von
        Anfang an eingeschaltet, es ist sonst nichts einzuschalten.

pt:
  steps:
    - tab: Usar no Chrome
      body: >-
        Abra o <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        na Chrome Web Store</a> e clique em <b>Usar no Chrome</b>.
    - tab: Abra o Google AI Studio
      body: >-
        Quem traduz é o Gemini, do Google, e o Gemini precisa de uma chave de API sua. Consegui-la é
        gratuito: abra o <a href="https://aistudio.google.com/apikey">Google AI Studio</a> e entre com uma
        conta Google.
    - tab: Crie a chave
      body: >-
        A página lista as chaves que você tem, que numa conta nova é nenhuma. Clique em <b>Create
        API key</b>.
    - tab: Escolha o projeto
      body: >-
        Uma chave pertence a um projeto do Google Cloud, e o AI Studio pergunta a qual. Escolha
        <b>Default project</b>, o que já está na lista, e clique em <b>Create key</b>. Qualquer
        projeto serve: a chave é a mesma.
    - tab: Copie a chave
      body: >-
        A chave aparece assim que o projeto fica pronto. Clique em <b>Copy</b>. Ela fica na página
        API keys, então dá para voltar e pegá-la depois.
    - tab: Cole a chave
      body: >-
        A página de <b>Opções</b> da extensão abre sozinha na primeira vez, e o botão <b>Options</b> do
        painel lateral abre de novo. Cole a chave em <b>Gemini API key</b>. Ela fica guardada neste
        navegador e não vai para ninguém além do Google.
    - tab: Clique no ícone
      body: >-
        Abra a página que quer traduzir — um vídeo com fala no
        <a href="https://www.youtube.com/">youtube.com</a> é o teste mais fácil para começar — e
        <b>clique no ícone do Interpretab na barra de ferramentas estando naquela aba</b>. Esse
        clique é como você dá permissão para ouvir a aba — sem ele, aparece um erro.
    - tab: Aperte Start
      body: >-
        Escolha o seu idioma no painel lateral e aperte <b>Start</b>. O áudio da aba já vem ligado,
        então não há mais nada para ativar.

ko:
  steps:
    - tab: Chrome에 추가
      body: <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome 웹 스토어의 Interpretab</a>을 열고 <b>Chrome에 추가</b>를 누릅니다.
    - tab: Google AI Studio 열기
      body: 번역은 Google의 Gemini가 하고, Gemini에는 본인 명의의 API 키가 필요합니다. 발급은 무료입니다. <a href="https://aistudio.google.com/apikey">Google AI Studio</a>를 열고 Google 계정으로 로그인합니다.
    - tab: 키 만들기
      body: 이 페이지에는 가지고 있는 키가 나열됩니다. 새 계정이라면 아직 하나도 없습니다. <b>Create API key</b>를 누릅니다.
    - tab: 프로젝트 선택
      body: 키는 Google Cloud 프로젝트에 속하므로 어느 프로젝트인지 물어봅니다. 목록에 이미 있는 <b>Default project</b>를 고르고 <b>Create key</b>를 누릅니다. 어느 프로젝트를 골라도 키는 똑같습니다.
    - tab: 키 복사
      body: 프로젝트가 준비되면 키가 나타납니다. <b>Copy</b>를 누릅니다. 키는 API keys 페이지에 남아 있어서 나중에 다시 가져올 수 있습니다.
    - tab: 키 붙여넣기
      body: 확장 프로그램의 <b>옵션</b> 페이지는 처음에 저절로 열리고, 사이드 패널의 <b>Options</b> 버튼으로 다시 열 수 있습니다. <b>Gemini API key</b>에 키를 붙여넣습니다. 키는 이 브라우저에 저장되며 Google 외에는 어디로도 보내지 않습니다.
    - tab: 아이콘 클릭
      body: 번역할 페이지를 엽니다. 처음 시험해 볼 때는 <a href="https://www.youtube.com/">youtube.com</a>에서 사람이 말하는 영상이 가장 간편합니다. 그런 다음 <b>그 탭에서 툴바의 Interpretab 아이콘을 클릭합니다.</b> 이 클릭이 탭 소리를 들어도 된다는 허가입니다. 건너뛰면 오류가 납니다.
    - tab: Start 누르기
      body: 사이드 패널에서 언어를 고르고 <b>Start</b>를 누릅니다. 탭 소리는 처음부터 켜져 있어서 따로 켤 것은 없습니다.

hi:
  steps:
    - tab: Chrome में जोड़ें
      body: >-
        <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome
        Web Store पर Interpretab</a> खोलें और <b>Chrome में जोड़ें</b> दबाएँ।
    - tab: Google AI Studio खोलें
      body: >-
        अनुवाद Google का Gemini करता है, और Gemini को आपकी अपनी API कुंजी चाहिए। कुंजी लेना मुफ़्त है:
        <a href="https://aistudio.google.com/apikey">Google AI Studio</a> खोलें और किसी Google खाते से
        साइन इन करें।
    - tab: कुंजी बनाएँ
      body: >-
        यह पेज आपकी मौजूदा कुंजियाँ दिखाता है — नए खाते में एक भी नहीं। <b>Create API key</b> दबाएँ।
    - tab: प्रोजेक्ट चुनें
      body: >-
        कुंजी किसी Google Cloud प्रोजेक्ट की होती है, और AI Studio पूछता है कि किस प्रोजेक्ट की। सूची में पहले से मौजूद
        <b>Default project</b> चुनें और <b>Create key</b> दबाएँ। कोई भी प्रोजेक्ट चलेगा — कुंजी एक जैसी ही रहती है।
    - tab: कुंजी कॉपी करें
      body: >-
        प्रोजेक्ट तैयार होते ही कुंजी दिख जाती है। <b>Copy</b> दबाएँ। वह API keys पेज पर बनी रहती है, इसलिए बाद में
        दोबारा ली जा सकती है।
    - tab: कुंजी पेस्ट करें
      body: >-
        एक्सटेंशन का <b>विकल्प</b> पेज पहली बार अपने आप खुलता है, और साइड पैनल का <b>Options</b> बटन उसे दोबारा खोल देता है।
        कुंजी को <b>Gemini API key</b> में पेस्ट करें। वह इसी ब्राउज़र में रहती है और Google के अलावा किसी को नहीं
        भेजी जाती।
    - tab: आइकॉन क्लिक करें
      body: >-
        जिस पेज का अनुवाद चाहिए उसे खोलें — पहली जाँच के लिए <a href="https://www.youtube.com/">youtube.com</a> पर
        बोलने वाला कोई वीडियो सबसे आसान है — और <b>उसी टैब पर टूलबार में Interpretab का आइकॉन क्लिक
        करें</b>। यही क्लिक उस टैब को सुनने की अनुमति है — इसे छोड़ देने पर त्रुटि मिलेगी।
    - tab: Start दबाएँ
      body: >-
        साइड पैनल में अपनी भाषा चुनें और <b>Start</b> दबाएँ। टैब की आवाज़ शुरू से चालू रहती है, इसलिए और कुछ चालू
        नहीं करना है।

ar:
  steps:
    - tab: الإضافة إلى Chrome
      body: >-
        افتح <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        في Chrome Web Store</a> واضغط <b>الإضافة إلى Chrome</b>.
    - tab: افتح Google AI Studio
      body: >-
        من يترجم هو Gemini من Google، وهو يحتاج مفتاح API خاصًا بك. الحصول عليه مجاني: افتح
        <a href="https://aistudio.google.com/apikey">Google AI Studio</a> وسجّل الدخول بحساب Google.
    - tab: أنشئ المفتاح
      body: >-
        تعرض الصفحة المفاتيح التي لديك، ولا يوجد أي مفتاح في حساب جديد. اضغط <b>Create API key</b>.
    - tab: اختر المشروع
      body: >-
        ينتمي المفتاح إلى مشروع في Google Cloud، ويسألك AI Studio عن المشروع. اختر <b>Default
        project</b> الموجود في القائمة، ثم اضغط <b>Create key</b>. أي مشروع يفي بالغرض؛ والمفتاح
        واحد في الحالتين.
    - tab: انسخ المفتاح
      body: >-
        يظهر المفتاح بمجرد أن يصبح المشروع جاهزًا. اضغط <b>Copy</b>. يبقى المفتاح في صفحة API keys،
        فيمكنك العودة إليه لاحقًا.
    - tab: الصق المفتاح
      body: >-
        تُفتح صفحة <b>الخيارات</b> في الإضافة من تلقاء نفسها في المرة الأولى، ويعيد فتحها زر <b>Options</b>
        في اللوحة الجانبية. الصق المفتاح في <b>Gemini API key</b>. يبقى في هذا المتصفح ولا يُرسَل إلى
        أحد غير Google.
    - tab: اضغط الأيقونة
      body: >-
        افتح الصفحة التي تريد ترجمتها — وأسهل تجربة أولى مقطع فيه كلام على
        <a href="https://www.youtube.com/">youtube.com</a> — و<b>اضغط أيقونة Interpretab في شريط
        الأدوات وأنت على تلك العلامة</b>. تلك النقرة هي إذنك بالاستماع إلى علامة التبويب —
        وتجاوُزها يعني رسالة خطأ.
    - tab: اضغط Start
      body: >-
        اختر لغتك في اللوحة الجانبية واضغط <b>Start</b>. صوت علامة التبويب مفعَّل من البداية، فلا شيء
        آخر عليك تشغيله.
