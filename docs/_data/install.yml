# The install steps, in the ten languages the guide is written in.
#
# They used to be a numbered list repeated inside every `index.md`. They are out
# here because the install section is now a slideshow — a picture, a tab strip
# and a pane per step — and ten copies of that markup, nine of them in a script
# nobody editing the HTML can read, is the arrangement in which a fix lands on
# one page and not the other nine. `_includes/install-steps.html` is the markup,
# once; this is the words, ten times.
#
# Getting the key is five of the steps and not one. It is the only part of the
# install that leaves Chrome, it is where somebody who has never seen a console
# gives up, and "get a free key at aistudio.google.com/apikey" was one clause
# covering a sign-in, a button, two dialogs and a copy. The two dialogs are
# written for an account that has never used the API, which is the account the
# guide is for: there is no project to put the key in yet, and the name AI
# Studio offers for the new one is in the reader's language, which the field
# refuses. The key and the project are both named Interpretab, so a reader who
# comes back to that page later can see what the key was for.
#
# Pinning is its own step for the same reason. A freshly installed extension has
# no icon on the toolbar, so "click the Interpretab icon" pointed at nothing —
# and the click is what grants the tab the permission to be listened to, so a
# reader who cannot find the icon gets an error instead of subtitles.
#
# The count is not fixed here — `_includes/head-custom.html` styles as many
# steps as English has — but every language has to have the same number of them,
# and `tests/assets.test.js` is where that is enforced.
#
# `body` is HTML rather than markdown: an include is not passed through the
# markdown converter, so the links and the bold have to arrive already made.
# Links are written plainly, with no `target`: the include adds one to every
# link it renders, so a translation cannot be the one that sends a reader out of
# the slideshow and loses their place in it.
# `tab` is the label on the step's button and has to stay short — ten of them
# wrap to a second row in every language. `next` is the button in the corner of
# every step but the last, which is there because the tab strip was not enough:
# ten numbered pills read as a table of contents, and readers were arriving at
# step one and stopping.
#
# The keys are the `code` values in `languages.yml`, and a page whose language
# is missing here falls back to English rather than rendering an empty slide.

en:
  next: Next
  ui:
    createApiKey: Create API key
    createKey: Create key
    createProject: Create project
    copyKey: Copy key
  steps:
    - tab: Add to Chrome
      body: >-
        Open <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        on the Chrome Web Store</a> and press <b>Add to Chrome</b>.
    - tab: Open Google AI Studio
      body: >-
        Interpretab translates with Google's Gemini, and Gemini needs an API key of your own.
        Getting one is free: open <a href="https://aistudio.google.com/apikey">Google AI Studio</a> and sign in
        with a Google account.
    - tab: Create a key
      body: >-
        The page lists the keys you have, which on a new account is none. Press
        <b>Create API key</b>.
    - tab: Name the key
      body: >-
        A key needs a name, and a Google Cloud project to belong to. Type <b>Interpretab</b> as the
        name. Underneath it, an account that has never used the API has nothing to choose from:
        <b>No Cloud Projects Available</b>.
    - tab: Make a project
      body: >-
        Open that list and pick <b>Create project</b>. The name it fills in for you is in your
        own language, and the field takes Latin letters only — clear it, type <b>Interpretab</b>,
        and press <b>Create project</b>.
    - tab: Copy the key
      body: >-
        The key dialog comes back with the new project in it. Press <b>Create key</b> and the key
        appears — press <b>Copy key</b>. It stays on the API keys page, so you can come back for it
        later.
    - tab: Paste it in
      body: >-
        Interpretab's <b>Options</b> page opens by itself the first time, and the <b>Options</b>
        button at the bottom of the side panel opens it again. Paste the key into
        <b>Gemini API key</b>. It is kept in this browser and goes to nobody but Google.
    - tab: Pin the icon
      body: >-
        Open the page you want translated — a video with talking in it on
        <a href="https://www.youtube.com/">youtube.com</a> is the easiest first test. A new
        extension has no icon on the toolbar yet: click Chrome's <b>puzzle-piece button</b>, find
        <b>Interpretab</b> in the list, and press the pin beside it.
    - tab: Click the icon
      body: >-
        The icon is on the toolbar now. <b>Click it, on the tab you want translated.</b> That click
        is how you give permission to listen to the tab; skip it and you get an error.
    - tab: Press Start
      body: >-
        Pick your language in the side panel and press <b>Start</b>. Play the video: the voice
        comes back in that language. If you hear no translation, pick a language other than the one
        the video is already in.

# Chinese, Japanese and Korean below are one line per `body` on purpose. A
# folded scalar joins its lines with a space, and a space between two kanji is a
# space a reader sees.
ja:
  next: 次へ
  ui:
    createApiKey: API キーを作成
    createKey: キーを作成
    createProject: プロジェクトを作成
    copyKey: 鍵をコピー
  steps:
    - tab: Chrome に追加
      body: <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome ウェブストアの Interpretab</a> を開き、<b>Chrome に追加</b>を押す。
    - tab: Google AI Studio を開く
      body: 翻訳するのは Google の Gemini で、Gemini には自分専用の API キーが必要です。取得は無料です。<a href="https://aistudio.google.com/apikey">Google AI Studio</a> を開き、Google アカウントでログインします。
    - tab: キーを作成
      body: このページには持っているキーが並びます。新しいアカウントならまだ一つもありません。<b>API キーを作成</b> を押します。
    - tab: キーに名前を付ける
      body: キーには名前と、所属する Google Cloud のプロジェクトが必要です。名前には <b>Interpretab</b> と入力します。その下のプロジェクト欄は、API を使ったことのないアカウントでは <b>No Cloud Projects Available</b> と出て、選べるものがありません。
    - tab: プロジェクトを作る
      body: その一覧を開き、<b>プロジェクトを作成</b> を選びます。あらかじめ入っている名前は日本語で、この欄は英字しか受け付けません。消して <b>Interpretab</b> と入力し、<b>プロジェクトを作成</b> を押します。
    - tab: キーをコピー
      body: キーのダイアログに戻ると、作ったプロジェクトが入っています。<b>キーを作成</b> を押すとキーが表示されるので、<b>鍵をコピー</b> を押します。キーは API keys のページに残るので、あとから取り直せます。
    - tab: キーを貼り付け
      body: 拡張機能の<b>オプション</b>ページは初回に自動で開きます。サイドパネル下部の <b>オプション</b> ボタンからも開けます。<b>Gemini API キー</b> にキーを貼り付けてください。キーはこのブラウザに保存され、Google 以外には送られません。
    - tab: アイコンを固定
      body: 翻訳したいページを開きます。最初の確認には <a href="https://www.youtube.com/">youtube.com</a> の話し声が入った動画が手軽です。入れたばかりの拡張機能はツールバーにアイコンが出ていません。Chrome の<b>パズルピースのボタン</b>を押し、一覧の <b>Interpretab</b> の横にあるピンを押してください。
    - tab: アイコンをクリック
      body: これでツールバーにアイコンが出ました。<b>翻訳したいタブで、そのアイコンをクリックします。</b>このクリックが、このタブの音声を聞いてよいという許可になります。押さずに始めるとエラーになります。
    - tab: Start を押す
      body: サイドパネルで言語を選び、<b>Start</b> を押します。動画を再生すると、その言語で声が返ってきます。訳された声が聞こえないときは、動画そのものの言語とは別の言語を選んでみてください。

zh:
  next: 下一步
  ui:
    createApiKey: 创建 API 密钥
    createKey: 创建密钥
    createProject: 创建项目
    copyKey: 复制密钥
  steps:
    - tab: 添加至 Chrome
      body: 打开 <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome 应用商店中的 Interpretab</a>，点击<b>添加至 Chrome</b>。
    - tab: 打开 Google AI Studio
      body: 翻译由 Google 的 Gemini 完成，而 Gemini 需要一个属于你自己的 API 密钥。申请是免费的：打开 <a href="https://aistudio.google.com/apikey">Google AI Studio</a>，用 Google 账号登录。
    - tab: 创建密钥
      body: 这个页面会列出你已有的密钥，新账号还是空的。点击 <b>创建 API 密钥</b>。
    - tab: 给密钥命名
      body: 密钥需要一个名字，还需要一个所属的 Google Cloud 项目。名字填 <b>Interpretab</b>。下面的项目一栏，在从没用过 API 的账号上会显示 <b>No Cloud Projects Available</b>，没有可选的项目。
    - tab: 新建项目
      body: 打开那个列表，选 <b>创建项目</b>。里面预填的名字是中文的，而这个输入框只收拉丁字母——清空它，输入 <b>Interpretab</b>，然后点 <b>创建项目</b>。
    - tab: 复制密钥
      body: 回到密钥的对话框，新建的项目已经在里面了。点 <b>创建密钥</b>，密钥就会出现，再点 <b>复制密钥</b>。密钥会留在 API keys 页面上，之后还能回去再拿。
    - tab: 粘贴密钥
      body: 扩展的<b>选项</b>页面第一次会自己打开，侧边栏底部的 <b>选项</b> 按钮也能再把它打开。把密钥粘贴到 <b>Gemini API 密钥</b> 里。它保存在这个浏览器中，除了 Google 不会发给任何人。
    - tab: 固定图标
      body: 打开要翻译的页面。第一次试的话，<a href="https://www.youtube.com/">youtube.com</a> 上一段有人说话的视频最方便。刚装好的扩展在工具栏上还没有图标：点 Chrome 的<b>拼图按钮</b>，在列表里找到 <b>Interpretab</b>，按一下旁边的图钉。
    - tab: 点击图标
      body: 现在图标在工具栏上了。<b>在要翻译的那个标签页上点它。</b>这次点击就是你授权它收听该标签页的方式——跳过它就会报错。
    - tab: 按 Start
      body: 在侧边栏选择语言，按 <b>Start</b>。播放视频，声音就会用那个语言回来。要是听不到翻译，就换一个和视频本身不同的语言试试。

es:
  next: Siguiente
  ui:
    createApiKey: Crear clave de API
    createKey: Crear clave
    createProject: Crear proyecto
    copyKey: Copiar clave
  steps:
    - tab: Añadir a Chrome
      body: >-
        Abre <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        en Chrome Web Store</a> y pulsa <b>Añadir a Chrome</b>.
    - tab: Abre Google AI Studio
      body: >-
        Quien traduce es Gemini, de Google, y Gemini necesita una clave de API tuya. Conseguirla es
        gratis: abre <a href="https://aistudio.google.com/apikey">Google AI Studio</a> e inicia sesión con una
        cuenta de Google.
    - tab: Crea la clave
      body: >-
        La página lista las claves que tienes, que en una cuenta nueva son ninguna. Pulsa
        <b>Crear clave de API</b>.
    - tab: Nombra la clave
      body: >-
        Una clave necesita un nombre y un proyecto de Google Cloud al que pertenecer. Escribe
        <b>Interpretab</b> como nombre. Debajo, una cuenta que nunca ha usado la API no tiene nada
        que elegir: <b>No Cloud Projects Available</b>.
    - tab: Crea el proyecto
      body: >-
        Abre esa lista y elige <b>Crear proyecto</b>. El nombre que viene puesto está en tu
        idioma y el campo solo acepta letras latinas: bórralo, escribe <b>Interpretab</b> y pulsa
        <b>Crear proyecto</b>.
    - tab: Copia la clave
      body: >-
        Vuelves al cuadro de la clave, ya con el proyecto nuevo. Pulsa <b>Crear clave</b> y aparece
        la clave: pulsa <b>Copiar clave</b>. Se queda en la página de API keys, así que puedes
        volver a por ella.
    - tab: Pégala
      body: >-
        La página de <b>Opciones</b> de la extensión se abre sola la primera vez, y el botón
        <b>Opciones</b> del panel lateral la vuelve a abrir. Pega la clave en <b>Clave de la API de
        Gemini</b>. Se guarda en este navegador y no se envía a nadie más que a Google.
    - tab: Fija el icono
      body: >-
        Abre la página que quieras traducir — un vídeo con voz en
        <a href="https://www.youtube.com/">youtube.com</a> es la prueba más fácil para empezar. Una
        extensión recién instalada aún no tiene icono en la barra: pulsa el <b>botón de la pieza de
        puzle</b> de Chrome, busca <b>Interpretab</b> en la lista y pulsa la chincheta que hay al
        lado.
    - tab: Pulsa el icono
      body: >-
        Ya tienes el icono en la barra. <b>Púlsalo estando en la pestaña que quieras traducir.</b>
        Ese clic es como das permiso para escuchar la pestaña; si te lo saltas, obtendrás un error.
    - tab: Pulsa Start
      body: >-
        Elige tu idioma en el panel lateral y pulsa <b>Start</b>. Dale al vídeo: la voz vuelve en
        ese idioma. Si no oyes ninguna traducción, elige un idioma distinto del que ya habla el
        vídeo.

fr:
  next: Suivant
  ui:
    createApiKey: Créer une clé API
    createKey: Créer une clé
    createProject: Créer un projet
    copyKey: Copier la clé
  steps:
    - tab: Ajouter à Chrome
      body: >-
        Ouvrez <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        sur le Chrome Web Store</a> et cliquez sur <b>Ajouter à Google Chrome</b>.
    - tab: Ouvrez Google AI Studio
      body: >-
        C'est Gemini, de Google, qui traduit, et Gemini a besoin d'une clé d'API à vous. L'obtenir est
        gratuit : ouvrez <a href="https://aistudio.google.com/apikey">Google AI Studio</a> et connectez-vous
        avec un compte Google.
    - tab: Créez la clé
      body: >-
        La page liste les clés que vous avez, c'est-à-dire aucune sur un compte neuf. Cliquez sur
        <b>Créer une clé API</b>.
    - tab: Nommez la clé
      body: >-
        Une clé a besoin d'un nom et d'un projet Google Cloud auquel appartenir. Saisissez
        <b>Interpretab</b> comme nom. En dessous, un compte qui n'a jamais utilisé l'API n'a rien à
        choisir : <b>No Cloud Projects Available</b>.
    - tab: Créez le projet
      body: >-
        Ouvrez cette liste et choisissez <b>Créer un projet</b>. Le nom déjà inscrit est dans
        votre langue et le champ n'accepte que les lettres latines : effacez-le, tapez
        <b>Interpretab</b>, puis cliquez sur <b>Créer un projet</b>.
    - tab: Copiez la clé
      body: >-
        La boîte de dialogue revient avec le nouveau projet. Cliquez sur <b>Créer une clé</b> : la clé
        apparaît, cliquez sur <b>Copier la clé</b>. Elle reste sur la page API keys, vous pouvez donc y
        revenir plus tard.
    - tab: Collez-la
      body: >-
        La page <b>Options</b> de l'extension s'ouvre d'elle-même la première fois, et le bouton
        <b>Options</b> du panneau latéral la rouvre. Collez la clé dans <b>Clé d'API Gemini</b>. Elle
        reste dans ce navigateur et n'est envoyée à personne d'autre que Google.
    - tab: Épinglez l'icône
      body: >-
        Ouvrez la page à traduire — une vidéo où quelqu'un parle sur
        <a href="https://www.youtube.com/">youtube.com</a> est le test le plus simple pour commencer.
        Une extension qui vient d'être installée n'a pas encore d'icône dans la barre d'outils :
        cliquez sur le <b>bouton en forme de pièce de puzzle</b> de Chrome, trouvez
        <b>Interpretab</b> dans la liste et cliquez sur l'épingle à côté.
    - tab: Cliquez sur l'icône
      body: >-
        L'icône est maintenant dans la barre d'outils. <b>Cliquez dessus depuis l'onglet à
        traduire.</b> Ce clic est la façon dont vous donnez la permission d'écouter l'onglet : sans
        lui, vous obtenez une erreur.
    - tab: Appuyez sur Start
      body: >-
        Choisissez votre langue dans le panneau latéral et appuyez sur <b>Start</b>. Lancez la
        vidéo : la voix revient dans cette langue. Si vous n'entendez aucune traduction, choisissez
        une langue autre que celle que parle déjà la vidéo.

de:
  next: Weiter
  ui:
    createApiKey: API-Schlüssel erstellen
    createKey: Schlüssel erstellen
    createProject: Projekt erstellen
    copyKey: Schlüssel kopieren
  steps:
    - tab: Hinzufügen
      body: >-
        <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        im Chrome Web Store</a> öffnen und auf <b>Hinzufügen</b> klicken.
    - tab: Google AI Studio öffnen
      body: >-
        Übersetzt wird von Gemini, dem Modell von Google, und Gemini braucht einen eigenen
        API-Schlüssel. Der ist kostenlos: <a href="https://aistudio.google.com/apikey">Google AI Studio</a>
        öffnen und mit einem Google-Konto anmelden.
    - tab: Schlüssel erstellen
      body: >-
        Die Seite listet Ihre Schlüssel auf — bei einem neuen Konto also keinen. Auf
        <b>API-Schlüssel erstellen</b> klicken.
    - tab: Schlüssel benennen
      body: >-
        Ein Schlüssel braucht einen Namen und ein Google-Cloud-Projekt, zu dem er gehört. Als Namen
        <b>Interpretab</b> eintragen. Darunter hat ein Konto, das die API noch nie benutzt hat,
        nichts zur Auswahl: <b>No Cloud Projects Available</b>.
    - tab: Projekt anlegen
      body: >-
        Diese Liste öffnen und <b>Projekt erstellen</b> wählen. Der Name, der dort schon steht, ist
        in Ihrer Sprache, und das Feld nimmt nur lateinische Buchstaben — also löschen,
        <b>Interpretab</b> eintippen und auf <b>Projekt erstellen</b> klicken.
    - tab: Schlüssel kopieren
      body: >-
        Der Dialog kommt mit dem neuen Projekt zurück. Auf <b>Schlüssel erstellen</b> klicken, und
        der Schlüssel erscheint — auf <b>Schlüssel kopieren</b> klicken. Er bleibt auf der Seite
        API keys, Sie können ihn also später wieder holen.
    - tab: Schlüssel einfügen
      body: >-
        Die Seite <b>Optionen</b> der Erweiterung öffnet sich beim ersten Mal von selbst, und die
        Schaltfläche <b>Optionen</b> im Seitenbereich öffnet sie wieder. Den Schlüssel in
        <b>Gemini-API-Schlüssel</b> einfügen. Er bleibt in diesem Browser und geht an niemanden
        außer Google.
    - tab: Symbol anheften
      body: >-
        Die zu übersetzende Seite öffnen — ein Video mit Sprache auf
        <a href="https://www.youtube.com/">youtube.com</a> ist der einfachste erste Test. Eine frisch
        installierte Erweiterung hat noch kein Symbol in der Symbolleiste: auf Chromes
        <b>Puzzleteil-Schaltfläche</b> klicken, <b>Interpretab</b> in der Liste suchen und auf die
        Stecknadel daneben klicken.
    - tab: Symbol anklicken
      body: >-
        Jetzt ist das Symbol in der Symbolleiste. <b>Auf dem Tab, den Sie übersetzen wollen,
        daraufklicken.</b> Mit diesem Klick geben Sie die Erlaubnis, den Tab mitzuhören — ohne ihn
        bekommen Sie eine Fehlermeldung.
    - tab: Start drücken
      body: >-
        Im Seitenbereich Ihre Sprache wählen und <b>Start</b> drücken. Das Video abspielen: die
        Stimme kommt in dieser Sprache zurück. Hören Sie keine Übersetzung, dann eine andere
        Sprache wählen als die, die im Video ohnehin gesprochen wird.

pt:
  next: Próximo
  ui:
    createApiKey: Criar chave de API
    createKey: Criar chave
    createProject: Criar projeto
    copyKey: Copiar chave
  steps:
    - tab: Usar no Chrome
      body: >-
        Abra o <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        na Chrome Web Store</a> e clique em <b>Usar no Chrome</b>.
    - tab: Abra o Google AI Studio
      body: >-
        Quem traduz é o Gemini, do Google, e o Gemini precisa de uma chave de API sua. Consegui-la é
        gratuito: abra o <a href="https://aistudio.google.com/apikey">Google AI Studio</a> e entre com uma
        conta Google.
    - tab: Crie a chave
      body: >-
        A página lista as chaves que você tem, que numa conta nova é nenhuma. Clique em
        <b>Criar chave de API</b>.
    - tab: Nomeie a chave
      body: >-
        Uma chave precisa de um nome e de um projeto do Google Cloud ao qual pertencer. Digite
        <b>Interpretab</b> como nome. Logo abaixo, uma conta que nunca usou a API não tem nada para
        escolher: <b>No Cloud Projects Available</b>.
    - tab: Crie o projeto
      body: >-
        Abra essa lista e escolha <b>Criar projeto</b>. O nome que já vem preenchido está no seu
        idioma, e o campo só aceita letras latinas — apague, digite <b>Interpretab</b> e clique em
        <b>Criar projeto</b>.
    - tab: Copie a chave
      body: >-
        A caixa da chave volta com o projeto novo. Clique em <b>Criar chave</b> e a chave aparece —
        clique em <b>Copiar chave</b>. Ela fica na página API keys, então dá para voltar e pegá-la
        depois.
    - tab: Cole a chave
      body: >-
        A página de <b>Opções</b> da extensão abre sozinha na primeira vez, e o botão <b>Opções</b>
        do painel lateral abre de novo. Cole a chave em <b>Chave de API do Gemini</b>. Ela fica
        guardada neste navegador e não vai para ninguém além do Google.
    - tab: Fixe o ícone
      body: >-
        Abra a página que quer traduzir — um vídeo com fala no
        <a href="https://www.youtube.com/">youtube.com</a> é o teste mais fácil para começar. Uma
        extensão recém-instalada ainda não tem ícone na barra de ferramentas: clique no <b>botão de
        peça de quebra-cabeça</b> do Chrome, ache <b>Interpretab</b> na lista e clique no alfinete ao
        lado.
    - tab: Clique no ícone
      body: >-
        Agora o ícone está na barra de ferramentas. <b>Clique nele estando na aba que quer
        traduzir.</b> Esse clique é como você dá permissão para ouvir a aba — sem ele, aparece um
        erro.
    - tab: Aperte Start
      body: >-
        Escolha o seu idioma no painel lateral e aperte <b>Start</b>. Dê play no vídeo: a voz volta
        nesse idioma. Se você não ouvir tradução nenhuma, escolha um idioma diferente do que o vídeo
        já fala.

ko:
  next: 다음
  ui:
    createApiKey: API 키 만들기
    createKey: 키 만들기
    createProject: 프로젝트 만들기
    copyKey: 키 복사
  steps:
    - tab: Chrome에 추가
      body: <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome 웹 스토어의 Interpretab</a>을 열고 <b>Chrome에 추가</b>를 누릅니다.
    - tab: Google AI Studio 열기
      body: 번역은 Google의 Gemini가 하고, Gemini에는 본인 명의의 API 키가 필요합니다. 발급은 무료입니다. <a href="https://aistudio.google.com/apikey">Google AI Studio</a>를 열고 Google 계정으로 로그인합니다.
    - tab: 키 만들기
      body: 이 페이지에는 가지고 있는 키가 나열됩니다. 새 계정이라면 아직 하나도 없습니다. <b>API 키 만들기</b>를 누릅니다.
    - tab: 키 이름 짓기
      body: 키에는 이름과, 키가 속할 Google Cloud 프로젝트가 필요합니다. 이름에는 <b>Interpretab</b>을 입력합니다. 그 아래에는, API를 한 번도 쓴 적 없는 계정이라면 고를 것이 없습니다. <b>No Cloud Projects Available</b>이라고 나옵니다.
    - tab: 프로젝트 만들기
      body: 그 목록을 열고 <b>프로젝트 만들기</b>를 고릅니다. 미리 채워져 있는 이름은 사용자의 언어로 되어 있는데, 이 칸은 라틴 문자만 받습니다. 지우고 <b>Interpretab</b>을 입력한 뒤 <b>프로젝트 만들기</b>를 누릅니다.
    - tab: 키 복사
      body: 새 프로젝트가 들어간 채로 키 대화상자가 다시 나옵니다. <b>키 만들기</b>를 누르면 키가 나타나니 <b>키 복사</b>를 누릅니다. 키는 API keys 페이지에 남아 있어서 나중에 다시 가져올 수 있습니다.
    - tab: 키 붙여넣기
      body: 확장 프로그램의 <b>옵션</b> 페이지는 처음에 저절로 열리고, 사이드 패널의 <b>옵션</b> 버튼으로 다시 열 수 있습니다. <b>Gemini API 키</b>에 키를 붙여넣습니다. 키는 이 브라우저에 저장되며 Google 외에는 어디로도 보내지 않습니다.
    - tab: 아이콘 고정
      body: 번역할 페이지를 엽니다. 처음 시험해 볼 때는 <a href="https://www.youtube.com/">youtube.com</a>에서 사람이 말하는 영상이 가장 간편합니다. 새로 설치한 확장 프로그램은 아직 툴바에 아이콘이 없습니다. Chrome의 <b>퍼즐 조각 버튼</b>을 누르고 목록에서 <b>Interpretab</b>을 찾아 옆에 있는 핀을 누릅니다.
    - tab: 아이콘 클릭
      body: 이제 툴바에 아이콘이 있습니다. <b>번역할 탭에서 그 아이콘을 클릭합니다.</b> 이 클릭이 탭 소리를 들어도 된다는 허가입니다. 건너뛰면 오류가 납니다.
    - tab: Start 누르기
      body: 사이드 패널에서 언어를 고르고 <b>Start</b>를 누릅니다. 영상을 재생하면 그 언어로 목소리가 돌아옵니다. 번역된 목소리가 들리지 않으면, 영상에서 원래 쓰는 언어가 아닌 다른 언어를 골라 보세요.

hi:
  next: आगे
  ui:
    createApiKey: Create API key
    createKey: Create key
    createProject: Create project
    copyKey: Copy key
  steps:
    - tab: Chrome में जोड़ें
      body: >-
        <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Chrome
        Web Store पर Interpretab</a> खोलें और <b>Chrome में जोड़ें</b> दबाएँ।
    - tab: Google AI Studio खोलें
      body: >-
        अनुवाद Google का Gemini करता है, और Gemini को आपकी अपनी API कुंजी चाहिए। कुंजी लेना मुफ़्त है:
        <a href="https://aistudio.google.com/apikey">Google AI Studio</a> खोलें और किसी Google खाते से
        साइन इन करें।
    - tab: कुंजी बनाएँ
      body: >-
        यह पेज आपकी मौजूदा कुंजियाँ दिखाता है — नए खाते में एक भी नहीं। <b>Create API key</b> दबाएँ।
    - tab: कुंजी का नाम रखें
      body: >-
        कुंजी को एक नाम चाहिए, और एक Google Cloud प्रोजेक्ट जिसकी वह हो। नाम में <b>Interpretab</b> लिखें। उसके नीचे,
        जिस खाते ने API कभी इस्तेमाल नहीं की उसके पास चुनने को कुछ नहीं होता: <b>No Cloud Projects Available</b>।
    - tab: प्रोजेक्ट बनाएँ
      body: >-
        उस सूची को खोलें और <b>Create project</b> चुनें। जो नाम पहले से भरा आता है वह आपकी भाषा में होता है, और यह
        खाना सिर्फ़ लैटिन अक्षर लेता है — उसे मिटाएँ, <b>Interpretab</b> टाइप करें और <b>Create project</b> दबाएँ।
    - tab: कुंजी कॉपी करें
      body: >-
        कुंजी वाला डायलॉग नए प्रोजेक्ट के साथ वापस आ जाता है। <b>Create key</b> दबाएँ और कुंजी दिख जाती है — <b>Copy key</b>
        दबाएँ। वह API keys पेज पर बनी रहती है, इसलिए बाद में दोबारा ली जा सकती है।
    - tab: कुंजी पेस्ट करें
      body: >-
        एक्सटेंशन का <b>विकल्प</b> पेज पहली बार अपने आप खुलता है, और साइड पैनल का <b>विकल्प</b> बटन उसे दोबारा खोल देता है।
        कुंजी को <b>Gemini API कुंजी</b> में पेस्ट करें। वह इसी ब्राउज़र में रहती है और Google के अलावा किसी को नहीं
        भेजी जाती।
    - tab: आइकॉन पिन करें
      body: >-
        जिस पेज का अनुवाद चाहिए उसे खोलें — पहली जाँच के लिए <a href="https://www.youtube.com/">youtube.com</a> पर
        बोलने वाला कोई वीडियो सबसे आसान है। अभी-अभी इंस्टॉल हुए एक्सटेंशन का आइकॉन टूलबार में नहीं होता: Chrome का
        <b>पहेली के टुकड़े वाला बटन</b> दबाएँ, सूची में <b>Interpretab</b> ढूँढें और उसके बगल की पिन दबाएँ।
    - tab: आइकॉन क्लिक करें
      body: >-
        अब आइकॉन टूलबार में है। <b>जिस टैब का अनुवाद चाहिए, उसी पर रहते हुए उसे क्लिक करें।</b> यही क्लिक उस टैब को
        सुनने की अनुमति है — इसे छोड़ देने पर त्रुटि मिलेगी।
    - tab: Start दबाएँ
      body: >-
        साइड पैनल में अपनी भाषा चुनें और <b>Start</b> दबाएँ। वीडियो चलाएँ — आवाज़ उसी भाषा में लौटती है। अनुवाद सुनाई
        न दे तो वीडियो जिस भाषा में है, उससे अलग कोई भाषा चुनें।

ar:
  next: التالي
  ui:
    createApiKey: Create API key
    createKey: Create key
    createProject: Create project
    copyKey: Copy key
  steps:
    - tab: الإضافة إلى Chrome
      body: >-
        افتح <a href="https://chromewebstore.google.com/detail/interpretab/johnocemcoemdhiogfgmphjmlghgdnbm">Interpretab
        في Chrome Web Store</a> واضغط <b>الإضافة إلى Chrome</b>.
    - tab: افتح Google AI Studio
      body: >-
        من يترجم هو Gemini من Google، وهو يحتاج مفتاح API خاصًا بك. الحصول عليه مجاني: افتح
        <a href="https://aistudio.google.com/apikey">Google AI Studio</a> وسجّل الدخول بحساب Google.
    - tab: أنشئ المفتاح
      body: >-
        تعرض الصفحة المفاتيح التي لديك، ولا يوجد أي مفتاح في حساب جديد. اضغط <b>Create API key</b>.
    - tab: سمِّ المفتاح
      body: >-
        يحتاج المفتاح إلى اسم وإلى مشروع في Google Cloud ينتمي إليه. اكتب <b>Interpretab</b> اسمًا
        له. وتحته، الحساب الذي لم يستخدم الـ API من قبل لا يجد ما يختاره: <b>No Cloud Projects
        Available</b>.
    - tab: أنشئ المشروع
      body: >-
        افتح تلك القائمة واختر <b>Create project</b>. الاسم المكتوب سلفًا يكون بلغتك، والحقل لا
        يقبل غير الحروف اللاتينية — امسحه واكتب <b>Interpretab</b> ثم اضغط <b>Create project</b>.
    - tab: انسخ المفتاح
      body: >-
        يعود مربّع المفتاح ومعه المشروع الجديد. اضغط <b>Create key</b> فيظهر المفتاح — اضغط
        <b>Copy key</b>. يبقى المفتاح في صفحة API keys، فيمكنك العودة إليه لاحقًا.
    - tab: الصق المفتاح
      body: >-
        تُفتح صفحة <b>الخيارات</b> في الإضافة من تلقاء نفسها في المرة الأولى، ويعيد فتحها زر <b>الخيارات</b>
        في اللوحة الجانبية. الصق المفتاح في <b>مفتاح Gemini API</b>. يبقى في هذا المتصفح ولا يُرسَل إلى
        أحد غير Google.
    - tab: ثبِّت الأيقونة
      body: >-
        افتح الصفحة التي تريد ترجمتها — وأسهل تجربة أولى مقطع فيه كلام على
        <a href="https://www.youtube.com/">youtube.com</a>. الإضافة المثبَّتة حديثًا ليس لها أيقونة
        في شريط الأدوات بعد: اضغط <b>زر قطعة الأحجية</b> في Chrome، وابحث عن <b>Interpretab</b> في
        القائمة، ثم اضغط الدبوس بجانبها.
    - tab: اضغط الأيقونة
      body: >-
        صارت الأيقونة في شريط الأدوات. <b>اضغطها وأنت على العلامة التي تريد ترجمتها.</b> تلك النقرة
        هي إذنك بالاستماع إلى علامة التبويب — وتجاوُزها يعني رسالة خطأ.
    - tab: اضغط Start
      body: >-
        اختر لغتك في اللوحة الجانبية واضغط <b>Start</b>. شغّل الفيديو: يعود الصوت بتلك اللغة. وإن لم
        تسمع أي ترجمة فاختر لغة غير التي يتحدث بها الفيديو أصلًا.
