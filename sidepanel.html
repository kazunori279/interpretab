<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="panelTitle">Interpretab</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <!-- No `lang` on <html>: this document is whichever locale Chrome resolved,
       and a hardcoded one would have a screen reader read Japanese aloud with
       English pronunciation. `localize()` sets it from the UI language before
       the first paint, along with every `data-i18n` below. -->
  <body>
    <header>
      <h1>Interpretab</h1>
      <div class="status">
        <span id="statusDot" class="dot disconnected"></span>
        <span id="statusText" data-i18n="statusIdle"></span>
      </div>
    </header>

    <!-- This build has been withdrawn and nothing below it will work until
         Chrome has fetched the new one. Above the error banner because it
         outranks anything else the panel could say, and every word of it is
         from `_locales`: the config file that raises it carries the verdict and
         a link, never the sentence. -->
    <div id="updateRequired" class="banner blocked" hidden>
      <p data-i18n="updateRequiredTitle"></p>
      <p id="updateSteps" class="small"></p>
      <p><a id="updateLink" href="#" target="_blank" rel="noreferrer" data-i18n="updateRequiredMore"></a></p>
    </div>

    <div id="error" class="banner error" hidden></div>

    <!-- The first precondition not yet met, in the order `lib/next-step.js`
         puts them. No `data-i18n` and no `data-link*`: which sentence this is
         and where its links point both change with the state, so `render()`
         fills it rather than `localize()`. -->
    <div id="nextStep" class="banner" hidden></div>

    <!-- One engine, one run, one tab — and the toolbar icon opens this panel
         anywhere, so this is the panel a bystander tab gets: what is running,
         where, and a Stop button that still works. -->
    <div id="elsewhereNote" class="banner" hidden></div>

    <section class="direction">
      <label class="row heading">
        <input type="checkbox" id="tabEnabled" />
        <span data-i18n="panelTabDirection"></span>
      </label>
      <div class="row indent">
        <span class="small" data-i18n="panelInto"></span>
        <select id="tabTarget" class="lang" data-i18n-title="panelTabTargetTitle"></select>
        <span class="small" data-i18n="panelSourceDetected"></span>
      </div>
      <div class="row indent">
        <label class="inline grow">
          <span data-i18n="panelDuckLevel"></span>
          <input type="range" id="duckLevel" min="0" max="100" step="5" />
          <output id="duckLevelOut"></output>
        </label>
      </div>
      <div class="row indent">
        <label class="inline">
          <input type="checkbox" id="tabCaptions" />
          <span data-i18n="panelPageSubtitles"></span>
        </label>
      </div>
    </section>

    <section class="direction">
      <label class="row heading">
        <input type="checkbox" id="micEnabled" />
        <span data-i18n="panelMicDirection"></span>
      </label>
      <div class="row indent">
        <select id="micMode" class="mode" data-i18n-title="panelMicModeTitle">
          <option value="simul" data-i18n="panelMicModeSimul"></option>
          <option value="conversation" data-i18n="panelMicModeConversation"></option>
        </select>
      </div>
      <div class="row indent">
        <span class="small" id="micInto" data-i18n="panelInto"></span>
        <select id="micSource" class="lang" data-i18n-title="panelMicSourceTitle"></select>
        <span class="small" id="micArrow">⇄</span>
        <select id="micTarget" class="lang"></select>
        <span class="small" id="micDetected" data-i18n="panelSourceDetected"></span>
      </div>
      <div class="row indent">
        <label class="inline">
          <input type="checkbox" id="micCaptions" />
          <span data-i18n="panelPageSubtitles"></span>
        </label>
      </div>
      <!-- Only on a Meet tab. The shim reaches exactly the page the run was
           started on, so a switch offered anywhere else is a promise the code
           has no way of keeping. -->
      <div class="row indent" id="micToCallRow" hidden>
        <label class="inline">
          <input type="checkbox" id="micToCall" />
          <span data-i18n="panelMicToCall"></span>
        </label>
      </div>
      <!-- What to do in Meet was one paragraph carrying four instructions, and
           as a block of grey it was a wall the eye slid off. Two lines now,
           ending in a link that opens the card below. -->
      <p class="note indent" id="micToCallNote" hidden data-i18n="panelMicToCallNote"
         data-link1="meetSteps"></p>
      <!-- Two spans and not one sentence: the first is shown only while the
           sound button is off, and a message that had to be spliced into
           another one would decide the word order of both. The second used to
           carry the headphones warning in full, four lines of grey that people
           read past on their way to Start; it is the first step of the card
           below now, where somebody who opens it is looking for it. -->
      <p class="note indent" id="micNoteSimul">
        <span id="micNoteSimulMuted" data-i18n="panelMicNoteMuted"></span>
        <span data-i18n="panelMicNoteSimul" data-link1="prepSteps"></span>
      </p>
      <p class="note indent" id="micNoteConversation" hidden data-i18n="panelMicNoteConversation"></p>
    </section>

    <!-- The three things to do before the call: the guide's "Before the call"
         phase, drawn the same way as the card under it and opened by the link
         in the microphone note. Headphones first, then the two directions,
         which is the order the guide puts them in and the order they matter
         in — a call set up on speakers is a call the two halves spend
         interpreting each other.

         The guide's own second and third steps are photographs of this panel.
         Here they are drawn instead, as the two rows they are: the switch, the
         side it listens to, and the language it is set to. The ring moves
         between the rows rather than the drawing changing, because which of
         the two a step is about is the whole of what separates them. -->
    <section class="stepcard" id="prepCard" hidden>
      <input class="stepcard-pick" type="radio" name="prepStep" id="prepstep-1" checked />
      <input class="stepcard-pick" type="radio" name="prepStep" id="prepstep-2" />
      <input class="stepcard-pick" type="radio" name="prepStep" id="prepstep-3" />

      <div class="stepcard-tabs">
        <label class="stepcard-tab stepcard-tab--1" for="prepstep-1">1</label>
        <label class="stepcard-tab stepcard-tab--2" for="prepstep-2">2</label>
        <label class="stepcard-tab stepcard-tab--3" for="prepstep-3">3</label>
      </div>

      <div class="stepcard-panes">
        <div class="stepcard-pane stepcard-pane--1">
          <p class="stepcard-say" data-i18n="panelPrepPhones"></p>
          <!-- Headphones, and nothing else. The step is about a cable, not
               about a screen, and a browser drawn around it would be a lie. -->
          <div class="stepcard-badge" aria-hidden="true">
            <span class="stepcard-glyph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 16v-4a8 8 0 0 1 16 0v4" />
                <rect x="2.5" y="13.5" width="4.5" height="7.5" rx="2.2" />
                <rect x="17" y="13.5" width="4.5" height="7.5" rx="2.2" />
              </svg>
            </span>
          </div>
          <label class="stepcard-next" for="prepstep-2">
            <span data-i18n="panelMeetNext"></span>
            <svg viewBox="0 0 32 24" fill="none" aria-hidden="true">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </label>
        </div>

        <div class="stepcard-pane stepcard-pane--2">
          <p class="stepcard-say" data-i18n="panelPrepTheirs"></p>
          <div class="stepcard-dialog" aria-hidden="true">
            <span class="stepcard-device">
              <span class="stepcard-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 12.5 9.5 18 20 6" />
                </svg>
              </span>
              <span class="stepcard-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
                  <path d="M16 9.2a4.4 4.4 0 0 1 0 5.6" />
                </svg>
              </span>
              <span class="stepcard-select"><span class="stepcard-line"></span></span>
            </span>
            <span class="stepcard-device">
              <span class="stepcard-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 12.5 9.5 18 20 6" />
                </svg>
              </span>
              <span class="stepcard-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="2.5" width="6" height="11" rx="3" />
                  <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
                  <path d="M12 18v3.5" />
                </svg>
              </span>
              <span class="stepcard-select stepcard-select--still">
                <span class="stepcard-line"></span>
              </span>
            </span>
          </div>
          <label class="stepcard-next" for="prepstep-3">
            <span data-i18n="panelMeetNext"></span>
            <svg viewBox="0 0 32 24" fill="none" aria-hidden="true">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </label>
        </div>

        <div class="stepcard-pane stepcard-pane--3">
          <p class="stepcard-say" data-i18n="panelPrepYours"></p>
          <div class="stepcard-dialog" aria-hidden="true">
            <span class="stepcard-device">
              <span class="stepcard-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 12.5 9.5 18 20 6" />
                </svg>
              </span>
              <span class="stepcard-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
                  <path d="M16 9.2a4.4 4.4 0 0 1 0 5.6" />
                </svg>
              </span>
              <span class="stepcard-select stepcard-select--still">
                <span class="stepcard-line"></span>
              </span>
            </span>
            <span class="stepcard-device">
              <span class="stepcard-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 12.5 9.5 18 20 6" />
                </svg>
              </span>
              <span class="stepcard-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="2.5" width="6" height="11" rx="3" />
                  <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
                  <path d="M12 18v3.5" />
                </svg>
              </span>
              <span class="stepcard-select"><span class="stepcard-line"></span></span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- The four things to do once the meeting is on screen: the guide's "In
         the call" phase, redrawn at the width of this column. Opened by the
         link in the note above and closed by default, because it is the size of
         the microphone card and the panel is not a page.

         One step at a time, picked by a hidden radio and shown by `:checked ~`.
         No script: the card works before `init` has run, and there is no second
         copy of "which step is showing" for `render()` to disagree with.

         Nothing here is a photograph. Three of the guide's seven steps are
         pictures of this very panel, which is what the reader already has in
         front of them, and the other four are drawings that cost nothing to
         redraw narrower. Meet's own labels are left out, for the reason the
         guide gives: they would have to be sourced per language, and a
         mistranslated button in a picture sends somebody hunting for a control
         that is not there. The two words that are drawn — `meet.google.com` and
         `Interpretab (translated)` — are translated nowhere. -->
    <section class="stepcard" id="meetCard" hidden>
      <input class="stepcard-pick" type="radio" name="meetStep" id="meetstep-1" checked />
      <input class="stepcard-pick" type="radio" name="meetStep" id="meetstep-2" />
      <input class="stepcard-pick" type="radio" name="meetStep" id="meetstep-3" />
      <input class="stepcard-pick" type="radio" name="meetStep" id="meetstep-4" />

      <!-- Numbers and no words. Four labels wide enough to read do not fit in a
           360px column, and the sentence for the step is in the pane anyway. -->
      <div class="stepcard-tabs">
        <label class="stepcard-tab stepcard-tab--1" for="meetstep-1">1</label>
        <label class="stepcard-tab stepcard-tab--2" for="meetstep-2">2</label>
        <label class="stepcard-tab stepcard-tab--3" for="meetstep-3">3</label>
        <label class="stepcard-tab stepcard-tab--4" for="meetstep-4">4</label>
      </div>

      <div class="stepcard-panes">
        <div class="stepcard-pane stepcard-pane--1">
          <p class="stepcard-say" data-i18n="panelMeetJoin"></p>
          <div class="stepcard-browser" aria-hidden="true">
            <div class="stepcard-tabstrip"><span class="stepcard-tabchip"></span></div>
            <div class="stepcard-omni">
              <span class="stepcard-nav"></span>
              <span class="stepcard-url">meet.google.com</span>
              <span class="stepcard-avatar"></span>
            </div>
            <!-- A call: the far end and you. Grey, because a mocked-up face is
                 detail a reader will try to read. -->
            <div class="stepcard-viewport">
              <div class="stepcard-tiles">
                <span class="stepcard-tile"></span>
                <span class="stepcard-tile stepcard-tile--self"></span>
              </div>
            </div>
          </div>
          <label class="stepcard-next" for="meetstep-2">
            <span data-i18n="panelMeetNext"></span>
            <svg viewBox="0 0 32 24" fill="none" aria-hidden="true">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </label>
        </div>

        <div class="stepcard-pane stepcard-pane--2">
          <p class="stepcard-say" data-i18n="panelMeetStart"></p>
          <!-- This panel's own button row, a few centimetres below the drawing
               of it. The word is not translated in any of the ten catalogues,
               so it is drawn rather than filled in. -->
          <div class="stepcard-bar" aria-hidden="true">
            <span class="stepcard-start">Start</span>
            <span class="stepcard-round"></span>
            <span class="stepcard-round"></span>
            <span class="stepcard-ghost"></span>
          </div>
          <label class="stepcard-next" for="meetstep-3">
            <span data-i18n="panelMeetNext"></span>
            <svg viewBox="0 0 32 24" fill="none" aria-hidden="true">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </label>
        </div>

        <div class="stepcard-pane stepcard-pane--3">
          <p class="stepcard-say" data-i18n="panelMeetPick"></p>
          <div class="stepcard-browser" aria-hidden="true">
            <div class="stepcard-tabstrip"><span class="stepcard-tabchip"></span></div>
            <div class="stepcard-omni">
              <span class="stepcard-nav"></span>
              <span class="stepcard-url">meet.google.com</span>
              <span class="stepcard-avatar"></span>
            </div>
            <!-- Meet's audio settings, with the microphone on the device this
                 extension puts there. The second row is the output, which is
                 where Bluetooth headphones get lost — drawn, and still, so it
                 is clear which of the two the step is asking for. -->
            <div class="stepcard-viewport stepcard-viewport--dialog">
              <div class="stepcard-dialog">
                <span class="stepcard-line stepcard-line--head"></span>
                <span class="stepcard-device">
                  <span class="stepcard-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="2.5" width="6" height="11" rx="3" />
                      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
                      <path d="M12 18v3.5" />
                    </svg>
                  </span>
                  <span class="stepcard-select stepcard-select--name">Interpretab (translated)</span>
                </span>
                <span class="stepcard-device">
                  <span class="stepcard-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
                      <path d="M16 9.2a4.4 4.4 0 0 1 0 5.6" />
                    </svg>
                  </span>
                  <span class="stepcard-select stepcard-select--still">
                    <span class="stepcard-line"></span>
                  </span>
                </span>
              </div>
            </div>
          </div>
          <label class="stepcard-next" for="meetstep-4">
            <span data-i18n="panelMeetNext"></span>
            <svg viewBox="0 0 32 24" fill="none" aria-hidden="true">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="currentColor" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </label>
        </div>

        <div class="stepcard-pane stepcard-pane--4">
          <p class="stepcard-say" data-i18n="panelMeetTalk"></p>
          <!-- You speak, and something arrives at the other end. Two glyphs and
               the arrow between them, because the alternative is a drawing of a
               meeting with words in it. -->
          <div class="stepcard-badge" aria-hidden="true">
            <span class="stepcard-glyph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2.5" width="6" height="11" rx="3" />
                <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
                <path d="M12 18v3.5" />
              </svg>
            </span>
            <svg class="stepcard-flow" viewBox="0 0 32 24" fill="none">
              <path d="M3 12h22m-8-8 8 8-8 8" stroke="#3f51b5" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="stepcard-glyph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 12c0 3.9-3.8 7-8.5 7-1 0-2-.14-2.9-.4L4 20.5l1.4-3.7C4.2 15.5 3.5 13.8
                         3.5 12c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z" />
              </svg>
            </span>
          </div>
        </div>
      </div>
    </section>

    <section class="row buttons">
      <button id="toggle" class="primary" data-i18n="panelStart"></button>
      <!-- Drawn here rather than loaded, like every other asset in this
           extension: two inline paths cost less than two files, and there is no
           request for anything to block on. The slash is a sibling of the glyph
           and shown by CSS when the button is off, so the muted icon cannot
           drift out of step with the one it crosses out. -->
      <button id="micMute" class="icon" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <path d="M12 18v3" />
          <path class="slash" d="M3 3l18 18" />
        </svg>
      </button>
      <button id="soundMute" class="icon" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path d="M17 9.5a4 4 0 0 1 0 5" />
          <path class="slash" d="M3 3l18 18" />
        </svg>
      </button>
      <button
        id="openOptions"
        class="ghost"
        data-i18n="panelOptions"
        data-i18n-title="panelOptions"
      ></button>
    </section>

    <!-- "usage" and not "cost": on the free tier there is no cost, and the
         doubling is just as real there — it is twice the quota. -->
    <p class="note" id="costNote" hidden data-i18n="panelCostNote"></p>

    <!-- What the run has spent so far, once the server has said. It takes the
         place of the static warning above: a live figure covers what that
         sentence was there to warn about, and says it in money.

         Two numbers and a dial. The dial says "meter" before the sentence is
         read, and the sentence is the only part that has to be read: the
         per-direction split and the token count were both answers to questions
         nobody was asking of a line this size. How long the run has been going
         earns its place because the dollars do not always mean anything — on
         the free tier they mean nothing at all, and the time is the only part
         of this line that is measured rather than estimated. The disclaimer
         rides in the message rather than in the title attribute, because a
         figure in dollars reads as a bill unless it says otherwise and nobody
         hovers.

         Two tails, one clock. The dollars are shown only to a key that is
         actually being charged — Options → Gemini API plan is where that is
         declared, because nothing in an API response says — and the free tail
         counts the audio instead, which is what the free tier's limits are
         spent on and what predicts the run failing. Which of the two is used is
         the only choice `renderUsage` makes: both are whole sentences in the
         catalogue, so no code path can assemble one without its disclaimer. -->
    <p class="note usage" id="usageNote" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 18a9 9 0 1 1 17 0" />
        <path d="M12 18l4.7-5.2" />
      </svg>
      <span id="usageText"></span>
    </p>

    <p class="note warn" id="captionNote" hidden></p>

    <p class="note warn" id="outputNote" hidden></p>

    <p class="note warn" id="micNote" hidden></p>

    <div id="transcript"></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
